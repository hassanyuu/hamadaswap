<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hamada Swap</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#111827;--muted:#6b7280;--accent:#4f46e5;--line:#e5e7eb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1220;--card:#1a1e33;--text:#f3f4f6;--muted:#9ca3af;--accent:#6366f1;--line:#2b3050;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:440px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
h1{font-size:20px;margin:0}
button{font:inherit;cursor:pointer;border:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:6px}
.lbl{color:var(--muted);font-size:13px;margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center}
select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-weight:600;min-width:130px}
input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:26px;font-weight:600;text-align:right}
.out{flex:1;font-size:26px;font-weight:600;text-align:right;overflow:hidden;text-overflow:ellipsis}
.flip{display:block;margin:-14px auto;position:relative;z-index:2;width:38px;height:38px;border-radius:12px;background:var(--card);color:var(--text);border:1px solid var(--line);font-size:18px}
.info{color:var(--muted);font-size:13px;padding:12px 4px;line-height:1.8}
.go{width:100%;padding:16px;border-radius:16px;background:var(--accent);color:#fff;font-size:17px;font-weight:700}
.go:disabled{opacity:.5}
.note{color:var(--muted);font-size:12px;text-align:center;margin-top:12px;line-height:1.7}
.msg{margin-top:10px;font-size:13px;text-align:center;min-height:18px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>🔄 Hamada Swap</h1><div id="ton-connect"></div></header>
  <div class="box"><div class="lbl">From</div>
    <div class="row"><select id="from"></select><input id="amt" type="number" inputmode="decimal" placeholder="0.0" value="1"></div></div>
  <button class="flip" id="flip" aria-label="Flip">⇅</button>
  <div class="box"><div class="lbl">To</div>
    <div class="row"><select id="to"></select><div class="out" id="out">0.0</div></div></div>
  <div class="info" id="info"></div>
  <button class="go" id="go">Connect Wallet</button>
  <div class="msg" id="msg"></div>
  <div class="note">Live market prices, indicative only. Real swaps will be enabled once connected to a DEX.</div>
</div>
<script>
const T={TON:["Toncoin",0,"the-open-network"],USDT:["Tether USD",0,"tether"],USDC:["USD Coin",0,"usd-coin"],BTC:["Bitcoin",0,"bitcoin"],ETH:["Ethereum",0,"ethereum"],BNB:["BNB",0,"binancecoin"],SOL:["Solana",0,"solana"],NOT:["Notcoin",0,"notcoin"]};
const $=id=>document.getElementById(id);
let connected=false,tc=null;
try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
try{
  tc=new TON_CONNECT_UI.TonConnectUI({manifestUrl:location.origin+"/tonconnect-manifest.json",buttonRootId:"ton-connect"});
  tc.onStatusChange(w=>{connected=!!w;calc()});
}catch(e){$("msg").textContent="Wallet module failed to load"}
const opts=Object.keys(T).map(k=>`<option value="${k}">${T[k][0]}</option>`).join("");
$("from").innerHTML=opts;$("to").innerHTML=opts;$("from").value="TON";$("to").value="USDT";
function fmt(n){return n>=1?n.toLocaleString("en",{maximumFractionDigits:4}):n.toPrecision(4)}
function calc(){
  const f=$("from").value,t=$("to").value,a=parseFloat($("amt").value)||0;
  const rate=T[f][1]/T[t][1];
  if(!isFinite(rate)||!rate){$("out").textContent="…";$("info").textContent="Loading live prices…";$("go").disabled=true;return}
  $("out").textContent=a?fmt(a*rate):"0.0";
  $("info").innerHTML=f===t?"Choose two different tokens":`1 ${T[f][0]} ≈ ${fmt(rate)} ${T[t][0]}<br>Live price · Network fee: set at execution`;
  $("go").disabled=f===t||!a;
  $("go").textContent=connected?"Preview Swap":"Connect Wallet";
}
["from","to","amt"].forEach(i=>$(i).addEventListener("input",calc));
$("flip").onclick=()=>{const f=$("from").value;$("from").value=$("to").value;$("to").value=f;calc()};
$("go").onclick=()=>{
  try{
    if(!connected&&tc){tc.openModal();return}
    $("msg").textContent=`Preview: ${$("amt").value} ${T[$("from").value][0]} → ${$("out").textContent} ${T[$("to").value][0]}. Real execution is not enabled yet.`;
  }catch(e){$("msg").textContent="Something went wrong"}
};
async function getJSON(url){
  const r=await Promise.race([fetch(url),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),8000))]);
  if(!r.ok)throw new Error("HTTP "+r.status);
  return await r.json();
}
const SOURCES=[
  async()=>{return await getJSON("https://prices.hamada56h5.workers.dev/")},
  async()=>{
    const d=await getJSON("https://min-api.cryptocompare.com/data/pricemulti?fsyms="+Object.keys(T).join(",")+"&tsyms=USD");
    const o={};for(const k in T){if(d[k]&&d[k].USD)o[k]=d[k].USD}return o;
  },
  async()=>{
    const ids=Object.values(T).map(v=>v[2]).join(",");
    const d=await getJSON("https://api.coingecko.com/api/v3/simple/price?ids="+ids+"&vs_currencies=usd");
    const o={};for(const k in T){const p=d[T[k][2]];if(p&&p.usd)o[k]=p.usd}return o;
  },
  async()=>{
    const pairs=["TON","BTC","ETH","BNB","SOL","NOT","USDC"].map(x=>x+"USDT");
    const d=await getJSON("https://data-api.binance.vision/api/v3/ticker/price?symbols="+encodeURIComponent(JSON.stringify(pairs)));
    const o={USDT:1};d.forEach(x=>{const k=x.symbol.replace("USDT","");o[k]=parseFloat(x.price)});return o;
  }
];
async function loadPrices(){
  let last="";
  for(const src of SOURCES){
    try{
      const o=await src();
      if(o.TON&&o.USDT){for(const k in o){if(T[k])T[k][1]=o[k]}$("msg").textContent="";calc();return}
    }catch(e){last=e.message}
  }
  if(!T.TON[1])$("msg").textContent="Could not load prices ("+last+"). Try turning off VPN or ad-blocker.";
}
calc();loadPrices();setInterval(loadPrices,30000);
</script>
</body>
</html>
